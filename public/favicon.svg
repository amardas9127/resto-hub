<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Inner highlight layer -->
  <rect width="32" height="16" rx="7" fill="url(#hi)"/>

  <!-- Receipt body -->
  <rect x="8" y="5" width="16" height="19" rx="2" fill="#fff" opacity="0.95"/>

  <!-- Zigzag bottom of receipt -->
  <polyline points="8,24 9.6,26 11.2,24 12.8,26 14.4,24 16,26 17.6,24 19.2,26 20.8,24 22.4,26 24,24"
    stroke="#fff" stroke-width="1.2" fill="none" stroke-linejoin="round"/>

  <!-- Receipt lines (content lines) -->
  <line x1="11" y1="10" x2="21" y2="10" stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="11" y1="13" x2="19" y2="13" stroke="#d97706" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="11" y1="15.5" x2="18" y2="15.5" stroke="#d97706" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- Total line -->
  <line x1="11" y1="19" x2="21" y2="19" stroke="#b45309" stroke-width="1.4" stroke-linecap="round"/>
</svg>