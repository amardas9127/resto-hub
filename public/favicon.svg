<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <!-- subtle inner highlight -->
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Inner highlight layer -->
  <rect width="32" height="16" rx="7" fill="url(#hi)"/>

  <!-- Fork (left) — 3 tines + handle -->
  <!-- tine 1 -->
  <line x1="9"  y1="5" x2="9"  y2="12" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
  <!-- tine 2 -->
  <line x1="11" y1="5" x2="11" y2="12" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
  <!-- tine 3 -->
  <line x1="13" y1="5" x2="13" y2="12" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
  <!-- fork cross-bar -->
  <line x1="9"  y1="12" x2="13" y2="12" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
  <!-- fork handle -->
  <line x1="11" y1="12" x2="11" y2="27" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Knife (right) -->
  <!-- blade -->
  <path d="M21 5 C21 5 23 8 23 13 L21 13 Z" fill="#fff"/>
  <!-- handle -->
  <line x1="21" y1="13" x2="21" y2="27" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Small plate arc at bottom-center for balance -->
  <path d="M10 26 Q16 29 22 26" stroke="#fff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>