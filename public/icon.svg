<svg 
  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <!-- Icon box gradient -->
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Shine overlay -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Dark shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#78350f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Outer background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <!-- Shine on top half -->
  <rect width="512" height="256" rx="96" fill="url(#shine)"/>
  <!-- ── Cutlery icon group, centered at (256, 200) ── -->
  <g transform="translate(256,210)" filter="url(#shadow)">
    <!-- FORK (left of center) -->
    <!-- Tine 1 -->
    <line x1="-40" y1="-110" x2="-40" y2="-58" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <!-- Tine 2 -->
    <line x1="-26" y1="-110" x2="-26" y2="-58" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <!-- Tine 3 -->
    <line x1="-12" y1="-110" x2="-12" y2="-58" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <!-- Fork cross bridge -->
    <rect x="-45" y="-62" width="39" height="9" rx="4" fill="#fff"/>
    <!-- Fork handle -->
    <line x1="-26" y1="-53" x2="-26" y2="110" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <!-- SPOON (center) -->
    <!-- Spoon bowl (ellipse) -->
    <ellipse cx="0" cy="-82" rx="20" ry="30" fill="#fff"/>
    <!-- Spoon handle -->
    <line x1="0" y1="-52" x2="0" y2="110" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <!-- KNIFE (right of center) -->
    <!-- Blade with pointed top -->
    <path d="M26,-110 C26,-110 40,-80 40,-50 L26,-50 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <!-- Knife handle divider -->
    <rect x="21" y="-52" width="19" height="7" rx="3" fill="#fff" opacity="0.7"/>
    <!-- Knife handle -->
    <line x1="30" y1="-45" x2="30" y2="110" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <!-- Plate arc at the bottom -->
    <path d="M-60,118 Q0,140 60,118" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.55"/>
  </g>
  <!-- ── Wordmark: RestroHub (centered) ── -->
  <text
    x="256"
    y="390"
    text-anchor="middle"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="72"
    font-weight="800"
    letter-spacing="-2"
  ><tspan fill="#ffffff">Restro</tspan><tspan fill="#1e293b">Hub</tspan></text>
  <!-- Tagline -->
  <text
    x="256"
    y="430"
    text-anchor="middle"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="26"
    font-weight="500"
    letter-spacing="4"
    fill="#ffffff"
    opacity="0.65"
  >RESTAURANT MANAGEMENT</text>
</svg>
